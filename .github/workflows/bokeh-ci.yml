name: Bokeh-CI

# Standard testing for faster feedback on common configurations
# Runs unit tests on latest Python across all platforms, everything else on Linux only

on:
  push:
    branches:
      - main
      - branch-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -l {0}

env:
  CHROME_VER: "141.0.7390.54"
  CHROME_REV: "chromium_3265"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history to get proper build version

      - name: Build Bokeh and Bokeh.js
        uses: ./.github/workflows/composite/build

  codebase:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Run codebase checks on all platforms
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      # Required for codebase tests that check file formatting (line endings, whitespace, etc).
      - name: Configure line endings in git
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: '3.12'
          source-tree: 'keep'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - name: Run codebase checks
        run: pytest --color=yes tests/codebase

      - name: Run tools tests
        run: pytest --color=yes tests/tools

  typing:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: ${{ matrix.python-version }}
          source-tree: 'keep'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - parallel:
        - name: Check library types with mypy
          run: |
            mypy --version
            mypy --no-sqlite-cache --show-traceback
        - name: Check types in examples with mypy
          run: |
            mypy --version
            mypy --no-sqlite-cache --show-traceback --config-file examples/mypy.cfg examples/basic/scatters/color_scatter.py
        - name: Check library types with pyright
          run: |
            pyright --version && pyright

  examples:
    needs: build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Examples: Linux only (Chrome/Chromium dependency)
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: ${{ matrix.python-version }}
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: Install chromium
        uses: ./.github/workflows/composite/install-chromium

      - name: List installed software
        uses: ./.github/workflows/composite/list-software
        with:
          include-chromium: 'true'

      - name: Start chrome headless
        working-directory: ./bokehjs
        run: node make test:spawn:headless

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: pytest -s -v --color=yes --tb line tests/test_examples.py

      - name: Collect results
        if: always()
        env:
          DST: "examples-report"
        run: |
          mkdir -p ${DST}
          cp --parents examples-report.html $(cat .images-list) ${DST}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examples-report
          path: examples-report

  unit-test:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Unit tests: Latest Python (3.14) on all platforms
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.14']
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: ${{ matrix.python-version }}
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run unit tests
        uses: ./.github/workflows/composite/run-unit-tests

  jupyter:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Prepare wheel-installed environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: '3.14'
          source-tree: 'delete'

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Install notebook host adapters explicitly
        run: |
          python -m pip install 'anywidget>=0.11' marimo
          python -c "import anywidget, marimo; print(anywidget.__version__, marimo.__version__)"

      - name: Verify automatic extension discovery
        run: |
          jupyter labextension list 2>&1 | grep -F '@bokeh/bokeh-jupyter'
          jupyter server extension list 2>&1 | grep -F 'bokeh.jupyter'
          python -c "import sys; from pathlib import Path; assert (Path(sys.prefix) / 'share/jupyter/labextensions/@bokeh/bokeh-jupyter/package.json').is_file()"
          python -c "import json, sys; from pathlib import Path; path = Path(sys.prefix) / 'etc/jupyter/jupyter_server_config.d/bokeh-jupyter.json'; assert json.loads(path.read_text()) == {'ServerApp': {'jpserver_extensions': {'bokeh.jupyter': True}}}"

      - name: Run wheel-installed Jupyter tests
        run: |
          pytest --color=yes -rs tests/unit/bokeh/io/test_anywidget.py
          pytest --color=yes tests/unit/bokeh/io/test_jupyter_runtime.py
          pytest --color=yes tests/integration/test_jupyter_extension.py
          pytest --color=yes tests/integration/test_marimo.py

  minimal-deps:
    needs: build
    runs-on: ubuntu-24.04

    env:
      OS: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: 'minimal-deps'
          source-tree: 'delete'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - name: Run dependency tests
        uses: ./.github/workflows/composite/run-deps-tests
        with:
          dep-type: 'minimal'

  core-deps:
    needs: build
    runs-on: ubuntu-24.04

    env:
      OS: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: 'core'
          source-tree: 'delete'

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - name: Run dependency tests
        uses: ./.github/workflows/composite/run-deps-tests
        with:
          dep-type: 'core'

  documentation:
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Documentation: Linux only
        os: [ubuntu-24.04]
        # Build only on the most recent version of Python, so that documentation
        # and included examples can utilize newest available syntax and standard APIs.
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Environment
        uses: ./.github/workflows/composite/test-setup
        with:
          test-env: ${{ matrix.python-version }}
          source-tree: 'delete'

      - name: Ensure Python version
        run: if [[ ! "$(python --version | cut -d' ' -f2)" == "${{ matrix.python-version }}"* ]]; then exit 1; fi

      - name: List installed software
        uses: ./.github/workflows/composite/list-software

      - name: Build docs
        run: bash tools/ci/build_docs.sh

      - name: Upload docs
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/bokeh/docs-html.tgz
