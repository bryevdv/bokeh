name: Build

description: 'Build Bokeh and Bokeh.js for testing'

runs:
  using: "composite"
  steps:
    # Remove nodejs from conda environment to avoid duplicate installation
    # We'll install Node.js via setup-node instead for better npm caching
    - name: Filter nodejs from environment file
      shell: bash
      run: grep -v '^\s*-\s*nodejs\b' conda/environment-build.yml > conda/environment-build-no-nodejs.yml

    - uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        mamba-version: "*"
        activate-environment: bk-test
        environment-file: conda/environment-build-no-nodejs.yml
        run-post: ${{ runner.os != 'Windows' }}

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          bokehjs/package-lock.json
          src/bokeh/jupyter/frontend/package-lock.json

    - name: Install node modules
      shell: bash -l {0}
      run: bash tools/ci/install_node_modules.sh

    - name: Build BokehJS
      working-directory: ./bokehjs
      shell: bash -l {0}
      run: node make build pack

    - name: Build first-party Jupyter extension
      working-directory: ./src/bokeh/jupyter/frontend
      shell: bash -l {0}
      run: |
        npm ci --no-progress
        npm run build

    - name: Verify generated Jupyter assets are committed
      shell: bash -l {0}
      run: |
        test -f src/bokeh/jupyter/anywidget.js
        test -f src/bokeh/jupyter/labextension/package.json
        test -f src/bokeh/jupyter/labextension/install.json
        find src/bokeh/jupyter/labextension/static -name 'remoteEntry.*.js' -print -quit | grep -q .
        git diff --exit-code -- src/bokeh/jupyter/anywidget.js src/bokeh/jupyter/labextension
        test -z "$(git ls-files --others --exclude-standard -- src/bokeh/jupyter/anywidget.js src/bokeh/jupyter/labextension)"

    - name: Build pip packages
      shell: bash -l {0}
      env:
        BOKEHJS_ACTION: 'install'
      run: python -m build .

    - name: Verify Jupyter frontend sources are not packaged
      shell: bash -l {0}
      run: |
        python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('dist').glob('bokeh-*.whl')); assert not any(path.startswith('bokeh/jupyter/frontend/') for path in ZipFile(wheel).namelist())"
        python -c "from pathlib import Path; import tarfile; archive = next(Path('dist').glob('bokeh-*.tar.gz')); assert not any('/src/bokeh/jupyter/frontend/' in path for path in tarfile.open(archive).getnames())"

    - name: Verify pip install from sdist
      shell: bash -l {0}
      run: bash tools/ci/verify_pip_install_from_sdist.sh

    - name: Verify pip install using sdist
      shell: bash -l {0}
      run: bash tools/ci/verify_pip_install_using_sdist.sh

    - name: Verify pip install using wheel
      shell: bash -l {0}
      run: bash tools/ci/verify_pip_install_using_wheel.sh

    - name: Build conda package
      shell: bash -l {0}
      run: bash tools/ci/build_conda_package.sh

    - name: Verify conda install
      shell: bash -l {0}
      run: bash tools/ci/verify_conda_install.sh

    - name: Upload wheel package
      uses: actions/upload-artifact@v6
      with:
        name: wheel-package
        path: dist/bokeh-*-py3-none-any.whl

    - name: Upload bokehjs package
      uses: actions/upload-artifact@v6
      with:
        name: bokehjs-package
        path: bokehjs/build/dist/bokeh-bokehjs-*.tgz
